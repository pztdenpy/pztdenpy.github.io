<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信件</title>
    <link rel="icon" type="image/png" href="ico.png">
    <style>
        :root {
            --bg-color: #2c3e50;
            --envelope-color: #f1c40f;
            --envelope-shadow: rgba(0, 0, 0, 0.2);
            --card-color: #ecf0f1;
            --text-color: #34495e;
            --heart-color: #e74c3c;
            --anim-speed: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            perspective: 1000px;
            cursor: pointer;
        }

        .envelope {
            position: relative;
            width: min(90vw, 800px);
            aspect-ratio: 1.6;
            background-color: #f39c12;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
            transition: transform var(--anim-speed) ease;
        }

        .flap {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
            left: 0;
            top: 0;
            pointer-events: none;
        }

        .flap.left {
            background-color: var(--envelope-color);
            clip-path: polygon(0 0, 50% 50%, 0 100%);
        }

        .flap.right {
            background-color: var(--envelope-color);
            clip-path: polygon(100% 0, 100% 100%, 50% 50%);
        }

        .flap.bottom {
            background-color: #f39c12;
            clip-path: polygon(0 100%, 50% 50%, 100% 100%);
            z-index: 4;
            transform-origin: bottom;
        }

        .flap.top {
            background-color: #f5b041;
            clip-path: polygon(0 0, 100% 0, 50% 55%);
            z-index: 5;
            transform-origin: top;
            transition: transform var(--anim-speed) ease, z-index var(--anim-speed) linear;
        }

        .password-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 20;
            text-align: center;
            width: 85%;
            max-width: 320px;
            display: none;
        }

        .password-modal.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .password-modal h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .password-modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .password-modal input:focus {
            border-color: #3498db;
        }

        .password-modal button {
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .password-modal button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(142, 197, 252, 0.4);
        }

        .password-modal button:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            min-height: 20px;
            margin-bottom: 10px;
        }

        .letter {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 90%;
            background: white;
            border-radius: 10px;
            padding: 40px;
            z-index: 2;
            transition: bottom var(--anim-speed) ease, z-index var(--anim-speed) linear;
            box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .letter-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease 0.4s, transform 0.5s ease 0.4s;
            width: 100%;
            height: 100%;
            /*overflow-y: auto;*/
        }

        .letter h2 {
            font-size: 2rem;
            color: var(--heart-color);
            margin-bottom: 30px;
            font-weight: 700;
            text-align: center;
        }

        .letter p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-color);
            font-weight: 500;
            text-align: left;
        }

        .lock-icon {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 35px;
            background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            z-index: 6;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .lock-icon::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 20px;
            border: 4px solid #f1c40f;
            border-bottom: none;
            border-radius: 15px 15px 0 0;
            z-index: -1;
        }

        .lock-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .container.open .lock-icon {
            opacity: 0;
        }

        .container.open .flap.top {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .container.open .letter {
            bottom: 50%;
            transform: translate(-50%, 50%);
            transition: bottom 0.6s ease 0.3s, transform 0.6s ease 0.3s, height 0.6s ease 0.3s, z-index 0s linear 0.3s;
            height: 80vh;
            width: min(90vw, 800px);
            max-width: 800px;
            max-height: 800px;
            z-index: 100;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .lock-icon.unlocking::before {
            transform: translateX(-50%) translateY(-10px);
            transition: transform 0.5s ease;
        }

        .lock-icon.unlocking {
            animation: lockShake 0.5s ease;
        }

        @keyframes lockShake {
            0%,
            100% {
                transform: translate(-50%, -50%);
            }

            25% {
                transform: translate(-52%, -50%);
            }

            75% {
                transform: translate(-48%, -50%);
            }
        }

        .container.open .lock-icon {
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .container.open .letter-content {
            opacity: 1;
            transform: translateY(0);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 5;
        }

        .container.open {
            z-index: 10;
        }

        .container.open~.overlay {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 480px) {
            .container {
                transform: scale(0.9);
            }

            .container.open .letter {
                width: 95vw;
                max-width: none;
                height: 70vh;
                transform: translate(-50%, 55%);
            }
        }

        @media (max-width: 600px) {
            .container.open .letter {
                width: 94vw;
                height: 85vh;
                transform: translate(-50%, 50%);
                padding: 20px;
            }

            .letter h2 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .letter p {
                font-size: 1rem;
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        .reading-time {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>
<div id="app">
    <envelope-component
            :is-unlocked="isUnlocked"
            :is-open="isEnvelopeOpen"
            :is-unlocking="isUnlocking"
            :letter-content="letterContent"
            :reading-time="readingTime"
            @click="handleEnvelopeClick"
    ></envelope-component>

    <div class="overlay"></div>

    <password-modal-component
            :show="showPasswordModal"
            :error-message="errorMessage"
            @submit="handlePasswordSubmit"
    ></password-modal-component>
</div>

<script src="vue.min.js"></script>
<script src="crypto-js.min.js"></script>
<script type="module" src="new.js"></script>
</body>

</html>
